<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام كاشير المطعم</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Tahoma';background:#f5f5f5;margin:0;padding:0;font-size:16px}

  /* الهيدر */
.header{background:#D32F2F;color:#fff;padding:12px;text-align:center;font-size:16px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.lang-btn{background:#fff;color:#D32F2F;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}

  /* التابات */
.tabs{display:flex;background:#fff;border-bottom:2px solid #D32F2F;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:15px 20px;cursor:pointer;white-space:nowrap;font-size:15px;font-weight:bold}
.tab.active{background:#D32F2F;color:#fff}

  /* الحاوية الرئيسية */
.container{display:flex;gap:10px;padding:10px;flex-direction:column}

  /* للموبايل: السلة فوك */
  @media (max-width: 768px) {
  .container{flex-direction:column-reverse}
  .item{width:48%!important;min-width:unset!important}
  .header{font-size:14px}
  }

.menu{flex:3}
.cart{flex:1;background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}

  /* عناصر المنيو */
.item{
    border:2px solid #ddd;padding:8px;margin:5px;border-radius:10px;
    cursor:pointer;text-align:center;width:23%;min-width:150px;
    position:relative;background:#fff;display:inline-block;vertical-align:top;
    transition:0.2s
  }
.item:active{transform:scale(0.95);background:#FFEBEE}
.item.soldout{opacity:0.5}
.item img{width:100%;height:90px;object-fit:cover;border-radius:8px;pointer-events:none;background:#f0f0f0}
.item div{font-size:14px;font-weight:bold;margin:5px 0}

  /* السلة */
.cart-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;border-bottom:1px dashed #ccc;padding:8px 0;font-size:15px}
.cart-qty button{background:#D32F2F;color:#fff;border:none;padding:8px 12px;border-radius:6px;margin:0 3px;font-size:16px;font-weight:bold;min-width:40px}

  /* الازرار */
.btn{background:#D32F2F;color:#fff;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;margin-top:10px;cursor:pointer;font-weight:bold;min-height:50px}
.btn:active{transform:scale(0.97)}
.btn.green{background:#4CAF50}
.btn.blue{background:#2196F3}
.btn.yellow{background:#FFC107;color:#000}

.edit-btn{background:#4CAF50;color:white;border:none;padding:6px 10px;border-radius:6px;font-size:13px;margin:3px;cursor:pointer;font-weight:bold}
.delete-btn{background:#f44336;color:white;border:none;padding:6px 10px;border-radius:6px;font-size:13px;margin:3px;cursor:pointer;font-weight:bold}
.soldout-btn{position:absolute;top:5px;left:5px;background:#000;color:#fff;font-size:11px;padding:4px 6px;border-radius:4px;cursor:pointer;z-index:2;font-weight:bold}

.total{font-size:28px;font-weight:bold;color:#D32F2F;text-align:center;margin:15px 0}

.manage{display:none;background:#fff;padding:15px;margin:10px;border-radius:10px}
.manage input,.manage select{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}

  #searchInput{width:calc(100% - 20px); padding:15px; margin:10px; border:2px solid #D32F2F; border-radius:10px; font-size:16px;}
</style>
</head>
<body>

<div id="mainApp">
<div class="header">
  <span id="title">1. الشاشة الرئيسية - نظام كاشير</span>
  <div>
    <button class="lang-btn" onclick="setLang('ar')">عربي</button>
    <button class="lang-btn" onclick="setLang('ku')">کوردی</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <span onclick="toggleManage()" style="cursor:pointer;font-size:20px">⚙️</span>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="manage" id="managePanel">
  <h3 id="manageTitle">4. ادارة المنيو</h3>
  <input type="text" id="newName" placeholder="اسم الوجبة">
  <input type="number" id="newPrice" placeholder="السعر">
  <select id="newCat"></select>
  <button class="btn green" id="addBtn" onclick="addNewItem()">اضافة وجبة جديدة</button>
  <div id="manageList"></div>
</div>

<div class="container">
  <div class="menu">
    <h3 id="menuTitle">المنيو - اضغط اضافة</h3>
    <div id="menuList"></div>
  </div>

  <div class="cart">
    <h3 id="cartTitle">السلة</h3>
    <label id="tableLabel">رقم الطاولة:</label>
    <select id="tableNum" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:2px solid #ddd;font-size:16px"></select>
    <div id="cartList"></div>
    <label id="discountLabel">خصم سريع:</label>
    <div style="display:flex;gap:5px">
      <button class="btn yellow" style="flex:1" onclick="discount(0)">0%</button>
      <button class="btn yellow" style="flex:1" onclick="discount(10)">10%</button>
      <button class="btn yellow" style="flex:1" onclick="discount(20)">20%</button>
    </div>
    <div class="total"><span id="totalLabel">المجموع الكلي</span>: <span id="total">0</span> <span id="currency">د.ع</span></div>
    <button class="btn" id="printBtn" onclick="printBill()">🖨️ طباعة فاتورة</button>
    <button class="btn green" id="saveBtn" onclick="saveBill()">💾 حفظ وفاتورة جديدة</button>
    <button class="btn blue" id="reportBtn" onclick="dailyReport()">📊 التقرير اليومي</button>
    <button onclick="exportMenu()" style="background:#FF9800;color:white;border:none;padding:15px;width:100%;border-radius:10px;margin-top:10px;font-size:16px;cursor:pointer;font-weight:bold">
    💾 تصدير المنيو
</button>
<button onclick="importMenu()" style="background:#9C27B0;color:white;border:none;padding:15px;width:100%;border-radius:10px;margin-top:10px;font-size:16px;cursor:pointer;font-weight:bold">
    📂 استيراد المنيو
</button>
  </div>
</div>
</div>

<script>
window.onload = function(){
  setLang('ar');
}
const translations = {
  ar: {title:"1. الشاشة الرئيسية - نظام كاشير",menu:"المنيو - اضغط اضافة",cart:"السلة",table:"رقم الطاولة:",discount:"خصم سريع:",total:"المجموع الكلي",currency:"د.ع",print:"🖨️ طباعة فاتورة",save:"💾 حفظ وفاتورة جديدة",report:"📊 التقرير اليومي",manage:"4. ادارة المنيو",add:"اضافة وجبة جديدة",all:"الكل",meals:"وجبات",iraqi:"وجبات عراقية",app:"مقبلات",drink:"مشروبات",sweet:"حلويات",offer:"عروض",safari:"سفري",table1:"طاولة 1",table2:"طاولة 2",edit:"تعديل",delete:"حذف",out:"نفذت"},
  ku: {title:"1. شاشەی سەرەکی - سیستمی کاشێر",menu:"مینۆ - کلیک بکە بۆ زیادکردن",cart:"سەبەتە",table:"ژمارەی مێز:",discount:"داشکاندنی خێرا:",total:"کۆی گشتی",currency:"د.ع",print:"🖨️ چاپکردنی فاتورە",save:"💾 پاشەکەوت و فاتورەی نوێ",report:"📊 ڕاپۆرتی ڕۆژانە",manage:"4. بەڕێوەبردنی مینۆ",add:"زیادکردنی خواردنی نوێ",all:"هەموو",meals:"خواردن",iraqi:"خواردنی عێراقی",app:"پێشخواردن",drink:"خواردنەوە",sweet:"شیرینی",offer:"ئۆفەر",safari:"بۆ ماڵەوە",table1:"مێز 1",table2:"مێز 2",edit:"دەستکاری",delete:"سڕینەوە",out:"تەواو بوو"},
  en: {title:"1. Main Screen - Cashier System",menu:"Menu - Click to Add",cart:"Cart",table:"Table No:",discount:"Quick Discount:",total:"Total",currency:"IQD",print:"🖨️ Print Bill",save:"💾 Save & New Bill",report:"📊 Daily Report",manage:"4. Menu Management",add:"Add New Item",all:"All",meals:"Meals",iraqi:"Iraqi Food",app:"Appetizers",drink:"Drinks",sweet:"Desserts",offer:"Offers",safari:"Takeaway",table1:"Table 1",table2:"Table 2",edit:"Edit",delete:"Delete",out:"Sold Out"}
};

let currentLang = 'ar';

// شريط البحث
document.addEventListener('DOMContentLoaded', function() {
    let searchInput = document.createElement('input');
    searchInput.id = 'searchInput';
    searchInput.placeholder = 'ابحث عن وجبة...';
    document.body.insertBefore(searchInput, document.getElementById('mainApp'));
    searchInput.addEventListener('keyup', function(){
        let search = this.value.toLowerCase();
        let filtered = menu.filter(item => item.name[currentLang].toLowerCase().includes(search));
        renderMenu(filtered);
    });
});

let menu = JSON.parse(localStorage.getItem('menu')) || [
  {name:{ar:'كباب',ku:'کەباب',en:'Kebab'},price:12000,cat:'وجبات عراقية',qty:0,soldout:false,img:'image/كباب.png'},
  {name:{ar:'كباب مع تمن',ku:'کەباب لەگەڵ برنج',en:'Kebab with Rice'},price:14000,cat:'وجبات عراقية',qty:0,soldout:false,img:'image/كباب مع تمن.jpg'}
]
let cart = {};
let currentDiscount = 0;
let currentCat = 'all';

function setLang(lang){
  currentLang=lang;
  document.body.dir = lang=='en'?'ltr':'rtl';
  document.body.lang = lang;
  let t=translations[lang];
  document.getElementById('title').innerText=t.title;
  document.getElementById('menuTitle').innerText=t.menu;
  document.getElementById('cartTitle').innerText=t.cart;
  document.getElementById('tableLabel').innerText=t.table;
  document.getElementById('discountLabel').innerText=t.discount;
  document.getElementById('totalLabel').innerText=t.total;
  document.getElementById('currency').innerText=t.currency;
  document.getElementById('printBtn').innerText=t.print;
  document.getElementById('saveBtn').innerText=t.save;
  document.getElementById('reportBtn').innerText=t.report;
  document.getElementById('manageTitle').innerText=t.manage;
  document.getElementById('addBtn').innerText=t.add;
  document.getElementById('tabs').innerHTML=`
    <div class="tab active" onclick="filterCat('all',this)">${t.all}</div>
    <div class="tab" onclick="filterCat('وجبات',this)">${t.meals}</div>
    <div class="tab" onclick="filterCat('وجبات عراقية',this)">${t.iraqi}</div>
    <div class="tab" onclick="filterCat('مقبلات',this)">${t.app}</div>
    <div class="tab" onclick="filterCat('مشروبات',this)">${t.drink}</div>
    <div class="tab" onclick="filterCat('حلويات',this)">${t.sweet}</div>
    <div class="tab" onclick="filterCat('عروض',this)">${t.offer}</div>
  `;
  document.getElementById('tableNum').innerHTML=`<option>${t.safari}</option><option>${t.table1}</option><option>${t.table2}</option>`;
  document.getElementById('newCat').innerHTML=`<option>${t.meals}</option><option>${t.iraqi}</option><option>${t.app}</option><option>${t.drink}</option><option>${t.sweet}</option><option>${t.offer}</option>`;
  renderMenu();
}

function filterCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderMenu();
}

function renderMenu(items = menu){
  let html='';
  items.filter(i=>currentCat=='all'||i.cat==currentCat).forEach((item,i)=>{
    let imgSrc = item.img || 'https://via.placeholder.com/150/CCCCCC/FFFFFF?text=No+Image';
    html+=`<div class="item ${item.soldout?'soldout':''}" onclick="addToCart(${i})">
      <span class="soldout-btn" onclick="toggleSoldout(${i});event.stopPropagation()">${translations[currentLang].out}</span>
      <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/150/CCCCCC/FFFFFF?text=No+Image'">
      <div>${item.name[currentLang]}</div>
      <div style="font-size:18px;color:#D32F2F">${item.price} ${translations[currentLang].currency}</div>
      <button onclick="editPrice(${i});event.stopPropagation()" class="edit-btn">${translations[currentLang].edit}</button>
      <button onclick="deleteItem(${i});event.stopPropagation()" class="delete-btn">${translations[currentLang].delete}</button>
    </div>`;
  });
  document.getElementById('menuList').innerHTML=html;
}

function addToCart(i){
  let name=menu[i].name[currentLang];
  if(!cart[name]) cart[name]={...menu[i],qty:1};
  else cart[name].qty++;
  updateCart();
}

function updateCart(){
  let html=''; let total=0;
  for(let name in cart){
    let item=cart[name];
    total+=item.price*item.qty;
    html+=`<div class="cart-item">
      <span style="font-weight:bold">${name} x${item.qty}</span>
      <span style="color:#D32F2F;font-weight:bold">${item.price*item.qty} ${translations[currentLang].currency}</span>
      <span class="cart-qty">
        <button onclick="changeQty('${name}',-1)">-</button>
        <button onclick="changeQty('${name}',1)">+</button>
        <button class="delete-btn" onclick="deleteItem('${name}')">${translations[currentLang].delete}</button>
      </span>
    </div>`;
  }
  document.getElementById('cartList').innerHTML=html;
  let finalTotal = total - (total*currentDiscount/100);
  document.getElementById('total').innerText = finalTotal.toLocaleString();
}

function deleteItem(name){
  if(typeof name === 'number'){
    if(confirm("متأكد تريد تحذف " + menu[name].name[currentLang] + " ؟")){
      menu.splice(name, 1);
      localStorage.setItem('menu', JSON.stringify(menu));
      renderMenu();
    }
  } else {
    delete cart[name];
    updateCart();
  }
}

function changeQty(name,d){cart[name].qty+=d; if(cart[name].qty<=0) delete cart[name]; updateCart();}
function discount(p){currentDiscount=p; updateCart();}
function toggleManage(){document.getElementById('managePanel').style.display = document.getElementById('managePanel').style.display=='none'?'block':'none';}
function addNewItem(){alert('اضافة من الادارة قريبا')}
function toggleSoldout(i){menu[i].soldout=!menu[i].soldout; saveMenu();}
function saveMenu(){localStorage.setItem('menu',JSON.stringify(menu)); renderMenu();}
function printBill(){window.print();}
function saveBill(){newBill();}
function newBill(){cart={};currentDiscount=0;updateCart();}
function dailyReport(){alert('التقرير اليومي')}

function editPrice(index){
    let newPrice = prompt("اكتبي السعر الجديد بالدينار:", menu[index].price);
    if(newPrice &&!isNaN(newPrice)){
        menu[index].price = parseInt(newPrice);
        localStorage.setItem('menu', JSON.stringify(menu));
        renderMenu();
    }
}

function exportMenu(){
    let dataStr = JSON.stringify(menu);
    let blob = new Blob([dataStr], {type: "application/json"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = "menu-backup-" + new Date().toLocaleDateString() + ".json";
    a.click();
    alert("تم حفظ نسخة احتياطية!");
}

function importMenu(){
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        let file = e.target.files[0];
        let reader = new FileReader();
        reader.onload = event => {
            menu = JSON.parse(event.target.result);
            localStorage.setItem('menu', JSON.stringify(menu));
            renderMenu();
            alert("تم استرجاع المنيو بنجاح!");
        };
        reader.readAsText(file);
    };
    input.click();
}
</script>
</body>
</html>
