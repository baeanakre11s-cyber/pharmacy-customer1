<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام كاشير المطعم</title>
<style>
  *{box-sizing:border-box;font-family:'Tahoma'}
  body{margin:0;padding:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#333}
  
  /* شاشة البداية */
  .start-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;padding:20px;text-align:center}
  .start-screen h1{color:#fff;font-size:32px;margin-bottom:5px}
  .start-screen p{color:#fff;opacity:0.9;margin-bottom:40px}
  .main-btn{width:90%;max-width:350px;padding:18px;margin:10px 0;border:none;border-radius:15px;font-size:20px;font-weight:bold;cursor:pointer;color:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
  .btn-green{background:linear-gradient(90deg,#4CAF50,#388E3C)}
  .btn-blue{background:linear-gradient(90deg,#2196F3,#1976D2)}
  .btn-red{background:linear-gradient(90deg,#f44336,#d32f2f)}
  
  /* شاشة التفعيل */
  .activate-screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999}
  .activate-box{background:#fff;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center}
  .activate-box input{width:100%;padding:12px;margin:15px 0;border:2px solid #667eea;border-radius:10px;font-size:18px;text-align:center}
  
  /* لوحة التحكم */
  #mainApp{display:none;padding:15px}
  .header{background:linear-gradient(90deg,#4CAF50,#2E7D32);color:#fff;padding:15px;border-radius:15px;text-align:center;font-size:20px;font-weight:bold;margin-bottom:15px}
  .back-btn{background:#9E9E9E;color:#fff;border:none;padding:8px 15px;border-radius:10px;float:left;cursor:pointer;margin-bottom:10px}
  
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
  .stat-card{flex:1;min-width:120px;background:#E8F5E9;color:#2E7D32;padding:12px;border-radius:12px;text-align:center;font-weight:bold}
  
  .form-box{background:#fff;padding:15px;border-radius:15px;margin-bottom:15px}
  .form-row{display:flex;gap:10px;margin-bottom:10px}
  .form-row input,.form-row select{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px}
  
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
  .btn{border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;color:#fff}
  .btn.green{background:#4CAF50}
  .btn.blue{background:#2196F3}
  .btn.orange{background:#FF9800}
  .btn.purple{background:#9C27B0}
  .btn.full{grid-column:1/3}
  
  .search-box{width:100%;padding:12px;border:2px solid #4CAF50;border-radius:12px;font-size:16px;margin-bottom:15px}
  
  .container{display:flex;gap:10px;flex-wrap:wrap}
  .menu{flex:3;background:#fff;padding:15px;border-radius:15px;min-width:300px}
  .cart{flex:1;background:#fff;padding:15px;border-radius:15px;min-width:250px}
  #menuList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:900px){#menuList{grid-template-columns:repeat(4,1fr)}}
  .item{border:1px solid #eee;padding:10px;border-radius:10px;text-align:center;cursor:pointer}
  .item:hover{background:#E3F2FD}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
  .tab{padding:8px 15px;background:#eee;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tab.active{background:#667eea;color:#fff}
  .total{font-size:22px;font-weight:bold;color:#D32F2F;text-align:center}
</style>
</head>
<body>

<!-- الشاشة الاولى -->
<div class="start-screen" id="startScreen">
  <h1>💎 مطعم الكاشير</h1>
  <p>مرحبا بك في نظام الكاشير</p>
  <button class="main-btn btn-green" onclick="showActivate()">دخول الموظفين 🔒</button>
  <button class="main-btn btn-blue" onclick="enterStore()">متجر الزبائن 🛒</button>
  <button class="main-btn btn-red" onclick="logout()">تسجيل خروج</button>
</div>

<!-- شاشة التفعيل -->
<div class="activate-screen" id="activateScreen">
  <div class="activate-box">
    <h2>🔒 تفعيل النظام</h2>
    <input type="text" id="licenseKey" placeholder="ادخل كود التفعيل">
    <button class="btn green" onclick="checkLicense()" style="width:100%">تفعيل</button>
    <button class="btn" style="background:#999;width:100%;margin-top:10px" onclick="hideActivate()">الغاء</button>
    <div id="errorMsg" style="color:red;margin-top:10px"></div>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="mainApp">
  <button class="back-btn" onclick="goHome()">الرجوع للرئيسية</button>
  <div class="header">لوحة تحكم مطعم الكاشير 📦</div>
  
  <div class="stats">
    <div class="stat-card">عدد الوجبات: <span id="itemCount">0</span> 📦</div>
    <div class="stat-card">قيمة المخزون: <span id="stockValue">0</span> د.ع 💰</div>
    <div class="stat-card">مبيعات اليوم: <span id="todaySales">0</span> د.ع 📊</div>
  </div>
  
  <div class="form-box">
    <div class="form-row">
      <input type="text" id="itemName" placeholder="اسم الوجبة">
      <select id="itemCat"></select>
    </div>
    <div class="form-row">
      <input type="number" id="itemPrice" placeholder="سعر البيع">
      <input type="number" id="itemCost" placeholder="سعر التكلفة">
    </div>
    
    <div class="btn-grid">
      <button class="btn blue" onclick="addItem()">اضافة وجبة</button>
      <button class="btn green" onclick="add10()">اضافة 10 تجريبي</button>
      <button class="btn orange" onclick="exportMenu()">💾 نسخ احتياطي</button>
      <button class="btn purple" onclick="importMenu()">📂 استيراد Excel</button>
      <button class="btn orange" onclick="window.print()">🖨️ طباعة</button>
      <button class="btn blue" onclick="resetData()">🔄 استعادة</button>
      <button class="btn purple full" onclick="dailyReport()">📊 التقرير اليومي</button>
    </div>
  </div>
  
  <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الوجبة... 🔍">
  
  <div class="container">
    <div class="menu">
      <div class="tabs" id="tabs"></div>
      <div id="menuList"></div>
    </div>
    <div class="cart">
      <h3>السلة</h3>
      <select id="tableNum" style="width:100%;padding:10px;border-radius:10px;margin-bottom:10px"></select>
      <div id="cartList"></div>
      <div class="total">المجموع: <span id="total">0</span> د.ع</div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="saveBill()">💾 حفظ وفاتورة جديدة</button>
    </div>
  </div>
</div>

<script>
const VALID_KEY = "SHFA-CASH-2026";
let menu = JSON.parse(localStorage.getItem('menu')) || [
  {name:'كباب',price:12000,cost:8000,cat:'وجبات عراقية'},
  {name:'برجر',price:10000,cost:6000,cat:'وجبات'},
  {name:'بيتزا',price:12000,cost:7000,cat:'وجبات'},
  {name:'بطاطا',price:3000,cost:1000,cat:'مقبلات'},
  {name:'بيبسي',price:1000,cost:500,cat:'مشروبات'}
];
let cart={},currentCat='الكل';
const cats=['الكل','وجبات','وجبات عراقية','مقبلات','مشروبات','حلويات'];

function showActivate(){document.getElementById('activateScreen').style.display='flex'}
function hideActivate(){document.getElementById('activateScreen').style.display='none'}
function checkLicense(){
  if(document.getElementById('licenseKey').value.toUpperCase() == VALID_KEY){
    localStorage.setItem('activated','true');
    document.getElementById('startScreen').style.display='none';
    document.getElementById('activateScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    initApp();
  }else{document.getElementById('errorMsg').innerText='الكود خطأ ❌'}
}
function enterStore(){alert('واجهة الزبائن قريبا')}
function logout(){localStorage.removeItem('activated');location.reload()}
function goHome(){document.getElementById('mainApp').style.display='none';document.getElementById('startScreen').style.display='flex'}

function initApp(){
  document.getElementById('itemCat').innerHTML=cats.filter(c=>c!='الكل').map(c=>`<option>${c}</option>`).join('');
  document.getElementById('tableNum').innerHTML=`<option>سفري</option><option>طاولة 1</option><option>طاولة 2</option>`;
  document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c=='الكل'?'active':''}" onclick="filterCat('${c}',this)">${c}</div>`).join('');
  renderMenu();updateStats();
}

function filterCat(c,el){currentCat=c;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderMenu()}
function renderMenu(){
  let html='';let filtered=menu.filter(i=>currentCat=='الكل'||i.cat==currentCat);
  filtered.forEach((item,i)=>{
    html+=`<div class="item" onclick="addToCart(${i})">
      <div>${item.name}</div><div>${item.price} د.ع</div>
    </div>`;
  });
  document.getElementById('menuList').innerHTML=html;
}
function addToCart(i){let n=menu[i].name;cart[n]?cart[n].qty++:cart[n]={...menu[i],qty:1};updateCart()}
function updateCart(){
  let html='',total=0;for(let n in cart){let it=cart[n];total+=it.price*it.qty;html+=`<div>${n} x${it.qty} = ${it.price*it.qty}</div>`}
  document.getElementById('cartList').innerHTML=html;document.getElementById('total').innerText=total;
}
function updateStats(){
  let stock=menu.reduce((a,b)=>a+b.cost,0);
  document.getElementById('itemCount').innerText=menu.length;
  document.getElementById('stockValue').innerText=stock;
}
function addItem(){alert('اضافة')}
function add10(){alert('تجريبي')}
function exportMenu(){alert('تصدير')}
function importMenu(){alert('استيراد')}
function dailyReport(){alert('التقرير')}
function saveBill(){cart={};updateCart()}
document.getElementById('searchInput').onkeyup=function(){let s=this.value.toLowerCase();renderMenu(menu.filter(i=>i.name.includes(s)))}

if(localStorage.getItem('activated')=='true'){document.getElementById('startScreen').style.display='none';document.getElementById('mainApp').style.display='block';initApp()}
</script>
</body>
</html>
